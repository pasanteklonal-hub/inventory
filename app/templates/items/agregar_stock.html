{% extends 'base.html' %}

{% block title %}Agregar al Stock{% endblock %}

{% block content %}
  <div class="my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h2 class="mb-4">Agregar al stock</h2>

        <form method="post" class="card shadow-sm p-4">
          <div class="mb-3">
            <label for="categoria_id" class="form-label">Categoría <span class="text-danger">*</span></label>
            <select class="form-select" id="categoria_id" name="categoria_id" required onchange="cargarItems()">
              <option value="">-- Selecciona una categoría --</option>
              {% for categoria in categorias %}
                <option value="{{ categoria.id }}" {% if categoria.id == producto_categoria_id %}selected{% endif %}>{{ categoria.nombre }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="item_id" class="form-label">Producto <span class="text-danger">*</span></label>
            <select class="form-select" id="item_id" name="item_id" required>
              <option value="">-- Selecciona un producto --</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="cantidad" class="form-label">Unidades a agregar <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="cantidad" name="cantidad" value="1" min="1" step="1" required>
          </div>

          <div class="mb-3">
            <label for="observacion" class="form-label">Observación</label>
            <textarea class="form-control" id="observacion" name="observacion" rows="3"></textarea>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="/inventario-general" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Agregar al Stock</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function cargarItems() {
      const categoriaId = document.getElementById('categoria_id').value;
      const selectItem = document.getElementById('item_id');
      selectItem.innerHTML = '<option value="">-- Selecciona un producto --</option>';

      const items = {
        {% for cat_id, items_list in items_por_categoria.items() %}
          {{ cat_id }}: [
            {% for item in items_list %}
              { id: {{ item.id }}, datos: {{ item.datos | tojson }}, stock: {{ item.stock }} },
            {% endfor %}
          ],
        {% endfor %}
      };

      (items[categoriaId] || []).forEach(item => {
        const option = document.createElement('option');
        option.value = item.id;
        option.textContent = `${item.datos ? Object.values(item.datos).join(' | ') : 'Producto #' + item.id} (Stock: ${item.stock})`;
        if (item.id === {{ producto_id or 'null' }}) {
          option.selected = true;
        }
        selectItem.appendChild(option);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const categoria = document.getElementById('categoria_id');
      if (categoria.value) cargarItems();
    });
  </script>
{% endblock %}

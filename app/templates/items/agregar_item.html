{% extends 'base.html' %}

{% block title %}Agregar Item{% endblock %}

{% block content %}
  <div class="my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h2 class="mb-4">Agregar Item al Inventario</h2>

        <form method="post" class="card shadow-sm p-4">
          <div class="mb-4">
            <label for="categoria_id" class="form-label">Categoría <span class="text-danger">*</span></label>
            <select class="form-select" id="categoria_id" name="categoria_id" required onchange="cargarCampos()">
              <option value="">-- Selecciona una categoría --</option>
              {% for categoria in categorias %}
                <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
              {% endfor %}
            </select>
          </div>

          <div id="campos-dinamicos">
            <!-- Los campos se cargarán aquí dinámicamente -->
          </div>

          <div class="mb-3">
            <label for="cantidad" class="form-label">Stock inicial <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="cantidad" name="cantidad" value="1" min="1" step="1" required>
          </div>

          <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
            <a href="/" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Item</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    async function cargarCampos() {
      const categoriaId = document.getElementById('categoria_id').value;
      const contenedor = document.getElementById('campos-dinamicos');

      if (!categoriaId) {
        contenedor.innerHTML = '';
        return;
      }

      try {
        const response = await fetch(`/api/campos/${categoriaId}`);
        const campos = await response.json();

        let html = '';
        campos.forEach(campo => {
          const requerido = campo.requerido ? 'required' : '';
          const asterisco = campo.requerido ? '<span class="text-danger">*</span>' : '';

          if (campo.tipo === 'select') {
            html += `
              <div class="mb-3">
                <label for="campo_${campo.id}" class="form-label">${campo.nombre} ${asterisco}</label>
                <select class="form-select" id="campo_${campo.id}" name="campo_${campo.id}" ${requerido}>
                  <option value="">-- Selecciona --</option>
                  ${campo.opciones.map(op => `<option value="${op.trim()}">${op.trim()}</option>`).join('')}
                </select>
              </div>
            `;
          } else if (campo.tipo === 'textarea') {
            html += `
              <div class="mb-3">
                <label for="campo_${campo.id}" class="form-label">${campo.nombre} ${asterisco}</label>
                <textarea class="form-control" id="campo_${campo.id}" name="campo_${campo.id}" rows="3" ${requerido}></textarea>
              </div>
            `;
          } else if (campo.tipo === 'date') {
            html += `
              <div class="mb-3">
                <label for="campo_${campo.id}" class="form-label">${campo.nombre} ${asterisco}</label>
                <input type="date" class="form-control" id="campo_${campo.id}" name="campo_${campo.id}" ${requerido}>
              </div>
            `;
          } else if (campo.tipo === 'number') {
            html += `
              <div class="mb-3">
                <label for="campo_${campo.id}" class="form-label">${campo.nombre} ${asterisco}</label>
                <input type="number" class="form-control" id="campo_${campo.id}" name="campo_${campo.id}" ${requerido}>
              </div>
            `;
          } else {
            html += `
              <div class="mb-3">
                <label for="campo_${campo.id}" class="form-label">${campo.nombre} ${asterisco}</label>
                <input type="text" class="form-control" id="campo_${campo.id}" name="campo_${campo.id}" ${requerido}>
              </div>
            `;
          }
        });

        contenedor.innerHTML = html;
      } catch (error) {
        console.error('Error:', error);
        contenedor.innerHTML = '<div class="alert alert-danger">Error al cargar los campos.</div>';
      }
    }
  </script>
{% endblock %}
